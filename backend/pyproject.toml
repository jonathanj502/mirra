[project]
name = "mirra-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "supabase>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "openai>=2.44.0",
    "silero-vad==6.2.1",
    "torch>=1.12.0",
    "torchaudio>=0.12.0",
    "librosa>=0.10",
    "numpy>=1.24",
    "soundfile>=0.12",
    "audioread>=3.0",
    "soxr>=0.5",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Render has no GPU; PyPI's Linux wheels otherwise pull in CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
