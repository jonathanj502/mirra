name: Validate release
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mirra_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: mirra_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration" || exit 1; done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/privacy.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/long_recordings.sql
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck && node --test tests/*.test.mjs
        working-directory: app
      - run: node website/build.mjs && node --test website/*.test.mjs
      - run: npx expo export --platform all --output-dir dist
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_placeholder
          EXPO_PUBLIC_MIRRA_BACKEND_URL: https://api.mirra.app
          EXPO_PUBLIC_WEBSITE_URL: https://mirra.app
      - run: npx expo prebuild --no-install
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: native-projects
          path: |
            app/ios
            app/android
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install torch==2.12.1 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]' && pytest -q
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-key
          OPENAI_API_KEY: test-key
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mirra:check backend
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npx expo prebuild --platform android --no-install
        working-directory: app
      - run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a > build.log 2>&1 || { tail -100 build.log; exit 1; }
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: app/android/build.log
          retention-days: 7
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx expo prebuild --platform ios
        working-directory: app
      - run: xcodebuild -workspace Mirra.xcworkspace -scheme Mirra -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -100 build.log; exit 1; }
        working-directory: app/ios
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_placeholder
          EXPO_PUBLIC_MIRRA_BACKEND_URL: https://api.mirra.app
          EXPO_PUBLIC_WEBSITE_URL: https://mirra.app
      - name: Launch the app in iOS Simulator
        timeout-minutes: 12
        working-directory: app
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in sorted(data["devices"].items(), reverse=True) for d in devices if "iOS" in runtime and d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" ios/build/Build/Products/Release-iphonesimulator/Mirra.app
          xcrun simctl launch "$device" com.mirra.app
          sleep 20
          xcrun simctl io "$device" screenshot ios-launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: |
            app/ios/build.log
            app/ios-launch.png
          retention-days: 7
